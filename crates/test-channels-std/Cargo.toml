[package]
name = "test-channels-std"
version = "0.0.0"
publish = false
edition = "2021"
description = "Tests for std channels instrumentation."

[dependencies]
hotpath = { workspace = true }

[features]
hotpath = ["hotpath/hotpath"]

# Without the `hotpath` feature HotpathGuard is a no-op type with no Drop impl,
# so the examples' explicit drop(guard) trips this lint in default builds.
[lints.clippy]
drop_non_drop = "allow"
