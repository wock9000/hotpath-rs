[package]
name = "test-channels-asc"
version = "0.0.0"
publish = false
edition = "2021"
description = "Tests for async channels instrumentation."

[dependencies]
async-channel = "2.5.0"
hotpath = { workspace = true, features = ["async-channel"] }
smol = "2.0"

[features]
hotpath = ["hotpath/hotpath"]

# Without the `hotpath` feature HotpathGuard is a no-op type with no Drop impl,
# so the examples' explicit drop(guard) trips this lint in default builds.
[lints.clippy]
drop_non_drop = "allow"
